name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The browser step waits on four Next.js dev servers and can hang if one
    # never becomes healthy. 45 minutes turns that into a failure rather than
    # into six hours of a held runner.
    timeout-minutes: 45
    # No `services:` block.
    #
    # This job used to run a postgres service and hand the isolation suite
    # `postgres://postgres:postgres@...` — the bootstrap SUPERUSER. A superuser
    # silently ignores every row-level security policy, so the suite would have
    # passed against a completely broken schema, which is the worst possible
    # failure mode for the one test we hand to a security reviewer.
    #
    # The suite now starts its own Postgres *and* PgBouncer through
    # Testcontainers and connects as `app_runtime`, a role with neither
    # superuser nor BYPASSRLS. That is the only configuration in which the
    # assertions mean anything, so the database is owned by the test rather
    # than by the workflow.
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # ONE STEP, because there is one gate.
      #
      # This job used to spell the gate out by hand — `pnpm lint`, then
      # `pnpm turbo run typecheck build test --filter=...[origin/main]`, then
      # `pnpm test:isolation`. Two things were wrong with that, and both were
      # silent:
      #
      #   1. IT HAD ALREADY DRIFTED. `pnpm verify` gained a browser step
      #      covering all 41 screens; this workflow did not, so every Playwright
      #      test would have been skipped on every pull request with nothing
      #      saying so. That is TOOLING-DEFECTS defect 7 — a gate that can be
      #      partially run — restated in YAML.
      #
      #   2. `--filter=...[origin/main]` SELECTED NOTHING ON A PUSH TO MAIN. The
      #      pushed commit *is* origin/main, so the changed-package set is empty
      #      and turbo ran zero tasks and exited 0. Green, having compiled and
      #      tested nothing, on the branch that matters most. The filter only
      #      ever worked on pull requests.
      #
      # Unfiltered and slower, deliberately. `scripts/verify.mjs` also passes
      # --force to every turbo step, because defect 5 recorded turbo replaying
      # EXIT=0 from cache while four test files were failing.
      #
      # What it runs: lint, typecheck, build, test, test:isolation, test:e2e.
      # Lint is inside it and still runs ONCE from the repository root —
      # import/no-restricted-paths resolves its zones against process.cwd(), so
      # eslint from a subdirectory matches nothing and passes silently.
      #
      # test:isolation is never filtered or skipped: it is the artifact handed
      # to a customer's security reviewer (docs/TOPOLOGY.md), and "we did not
      # touch that package" is not an argument a reviewer accepts.
      #
      # test:e2e starts the compose stack, seeds it and drives a browser. The
      # runner already needs Docker for Testcontainers, so this adds no new
      # requirement — but it has never run on a runner. See docs/CI-AUDIT.md.
      - run: pnpm verify

  # ADR-0015 makes these mandatory rather than advisory. npm's supply chain has
  # the worst incident record of the major ecosystems, and `ignore-scripts` plus
  # a scanner is what turns that from an accepted risk into a controlled one.
  #
  # NOTE: no repository in this workspace has a git remote yet (PO-01), so this
  # workflow has never actually executed. It is written to be correct on the day
  # a remote exists; until then it is untested, and claiming otherwise would be
  # the same "green proves nothing" failure that docs/TOOLING-DEFECTS.md exists
  # to prevent.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      # Fails if .npmrc ever stops blocking postinstall scripts. Postinstall is
      # the primary npm attack vector, and this single mitigation neutralises
      # most historical incidents.
      - name: ignore-scripts is enforced
        run: |
          if ! grep -qx 'ignore-scripts=true' .npmrc; then
            echo '::error::.npmrc must set ignore-scripts=true (ADR-0015)'
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # OSV rather than `npm audit`, whose signal is too weak to gate on.
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.2.4
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml

      # Enterprise questionnaires request an SBOM directly, so it is produced as
      # a build artifact rather than assembled under deal pressure later.
      #
      # cdxgen, NOT @cyclonedx/cyclonedx-npm: the latter shells out to `npm ls`,
      # which does not understand a pnpm workspace and exits 1. Verified
      # locally — cdxgen emits CycloneDX 1.5 with 689 components here.
      #
      # Run from a PINNED devDependency via `pnpm exec`. The fetch-and-run
      # alternative executes an arbitrary registry package at build time, which
      # is the exact attack surface ADR-0015 blocks — and the workspace guard
      # refuses it.
      - name: CycloneDX SBOM
        run: pnpm exec cdxgen -t javascript --spec-version 1.5 -o sbom.cdx.json .

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
